<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PriceCheck</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151d30;
      --surface-elevated: #1e2942;
      --border: #2a3854;
      --border-focus: #38bdf8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #4ade80;
      --danger: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --price-color: #fbbf24;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(21, 29, 48, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar .brand {
      font-size: 1.15rem; font-weight: 800;
      letter-spacing: -0.5px; color: var(--accent);
    }
    .topbar .brand span { color: var(--text-main); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; padding: 5px 12px; border-radius: 30px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .status-badge.ok  { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-badge.err { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }
    .status-badge.loading { background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .status-badge .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ── TAB CONTENT ── */
    .page { display: none; flex: 1; flex-direction: column; padding-bottom: 90px; }
    .page.active { display: flex; }

    /* ── SCANNER ── */
    .scanner-viewport-container {
      position: relative;
      width: 100%;
      height: 280px;
      background: #000;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    #reader { width: 100%; height: 100%; }
    #reader * { display: none !important; }
    #reader video { display: block !important; width: 100% !important; height: 100% !important; object-fit: cover; }

    .scanner-target-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 10;
      background: rgba(0, 0, 0, 0.25);
    }
    .target-box {
      width: 240px; height: 140px; position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-sm);
    }
    .corner-bracket {
      position: absolute; width: 20px; height: 20px;
      border-color: var(--accent); border-style: solid;
    }
    .cb-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
    .cb-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
    .cb-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
    .cb-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

    .laser-line {
      position: absolute; left: 5%; right: 5%; height: 2px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: laserScan 2s infinite ease-in-out;
    }
    @keyframes laserScan {
      0% { top: 10%; opacity: 0; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0; }
    }

    .status-text {
      text-align: center; font-size: 0.82rem; color: var(--text-muted);
      padding: 10px 16px 4px; font-weight: 500;
    }

    .controls-grid {
      display: flex; gap: 8px; padding: 6px 16px;
      justify-content: center; flex-wrap: wrap;
    }

    .btn {
      border: none; border-radius: var(--radius-md);
      padding: 10px 18px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: all 0.15s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-accent { background: var(--accent); color: #0b0f19; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-secondary { background: var(--surface-elevated); color: var(--text-main); border: 1px solid var(--border); }
    .btn-full { width: 100%; }

    .search-bar-wrap {
      display: flex; gap: 8px; padding: 10px 16px;
    }
    .search-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-main); font-size: 0.95rem;
      padding: 10px 14px; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--border-focus); }
    .search-input::placeholder { color: var(--text-muted); }

    /* ── RESULT CARD ── */
    .result-container { padding: 8px 16px; }
    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px; animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card.found { border-color: rgba(74, 222, 128, 0.4); }
    .result-card.not-found { border-color: rgba(248, 113, 113, 0.4); }
    .result-header { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; }
    .result-title { font-size: 1.1rem; font-weight: 800; margin: 6px 0 10px; line-height: 1.35; }
    .result-price-tag { font-size: 2.2rem; font-weight: 900; color: var(--price-color); letter-spacing: -0.5px; }
    .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
    .tag {
      background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; color: var(--text-muted);
    }
    .tag strong { color: var(--text-main); }

    /* ── BROWSE LIST ── */
    .product-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .product-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color 0.15s; cursor: pointer;
    }
    .product-card:active { border-color: var(--accent); }
    .p-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
    .p-sub { font-size: 0.75rem; color: var(--text-muted); }
    .p-price { font-size: 1.15rem; font-weight: 800; color: var(--price-color); }
    .add-btn {
      background: var(--accent); color: #0b0f19; border: none;
      border-radius: var(--radius-sm); width: 32px; height: 32px;
      font-size: 1.1rem; font-weight: 800; margin-left: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ── BASKET PAGE ── */
    .basket-summary-card {
      margin: 12px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .b-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .b-total { font-size: 1.8rem; font-weight: 900; color: var(--price-color); }
    .basket-items { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .basket-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .qty-controls {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 2px 4px;
    }
    .qty-controls button {
      width: 24px; height: 24px; border: none; background: transparent;
      color: var(--text-main); font-weight: 800; cursor: pointer;
    }

    /* ── NAVIGATION TAB BAR ── */
    .tabbar {
      display: flex; background: var(--surface); border-top: 1px solid var(--border);
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 10px 0 8px; border: none; background: none;
      color: var(--text-muted); font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; cursor: pointer; position: relative;
    }
    .tab-btn .icon { font-size: 1.25rem; }
    .tab-btn.active { color: var(--accent); }
    .badge-count {
      position: absolute; top: 4px; right: calc(50% - 20px);
      background: var(--danger); color: #fff; font-size: 0.62rem; font-weight: 800;
      min-width: 16px; height: 16px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; padding: 0 4px;
    }

    .timestamp-bar {
      position: fixed; bottom: calc(52px + env(safe-area-inset-bottom));
      left: 0; right: 0; z-index: 90; text-align: center;
      font-size: 0.72rem; color: var(--accent); font-weight: 600;
      padding: 4px 10px; background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid var(--border); pointer-events: none;
    }

    #toast {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: var(--surface-elevated); border: 1px solid var(--border);
      color: var(--text-main); padding: 8px 18px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.25s;
      pointer-events: none; z-index: 1000;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandText">Price<span>Check</span></div>
  <div id="dbStatusBadge" class="status-badge err">
    <div class="pulse-dot"></div><span>Offline</span>
  </div>
</header>

<!-- SCAN TAB -->
<div id="page-scan" class="page active">
  <div class="scanner-viewport-container">
    <div id="reader"></div>
    <div class="scanner-target-overlay">
      <div class="target-box">
        <div class="corner-bracket cb-tl"></div>
        <div class="corner-bracket cb-tr"></div>
        <div class="corner-bracket cb-bl"></div>
        <div class="corner-bracket cb-br"></div>
        <div class="laser-line"></div>
      </div>
    </div>
  </div>
  <div id="scanStatus" class="status-text">Press Start to enable camera</div>
  
  <div class="controls-grid">
    <button class="btn btn-accent" id="btnStart" onclick="startScan()">📷 Start Camera</button>
    <button class="btn btn-secondary" id="btnStop" onclick="stopScan()" style="display:none">⏹ Stop</button>
    <button class="btn btn-secondary" id="btnFlip" onclick="flipCamera()" style="display:none">🔄 Flip</button>
    <button class="btn btn-secondary" id="btnFlash" onclick="toggleFlash()" style="display:none">🔦 Flash</button>
  </div>

  <div class="search-bar-wrap">
    <input class="search-input" id="manualBarcode" type="text" inputmode="numeric"
           placeholder="Type barcode or product name…" onkeydown="if(event.key==='Enter')manualSearch()" />
    <button class="btn btn-secondary" onclick="manualSearch()">🔍</button>
  </div>

  <div id="resultArea" class="result-container"></div>
</div>

<!-- BROWSE TAB -->
<div id="page-search" class="page">
  <div class="search-bar-wrap" style="padding-top:16px;">
    <input class="search-input" id="browseInput" type="text" placeholder="Search catalog…" oninput="renderBrowse()" />
  </div>
  <div id="browseList" class="product-list"></div>
</div>

<!-- BASKET TAB -->
<div id="page-basket" class="page">
  <div class="basket-summary-card">
    <div>
      <div class="b-label">Grand Total</div>
      <div class="b-total" id="basketTotal">₱0.00</div>
    </div>
    <div style="font-size:0.8rem;color:var(--text-muted)" id="basketCountLabel">0 items</div>
  </div>
  <div id="basketList" class="basket-items"></div>
  <div style="padding: 16px;">
    <button class="btn btn-secondary btn-full" style="color:var(--danger);" onclick="clearBasket()">Clear Basket</button>
  </div>
</div>

<nav class="tabbar">
  <button class="tab-btn active" id="tab-scan" onclick="showTab('scan')"><span class="icon">📷</span>Scan</button>
  <button class="tab-btn" id="tab-search" onclick="showTab('search')"><span class="icon">🔍</span>Browse</button>
  <button class="tab-btn" id="tab-basket" onclick="showTab('basket')">
    <span class="icon">🧺</span>Basket
    <span class="badge-count" id="basketBadge" style="display:none">0</span>
  </button>
</nav>

<div id="lastUpdated" class="timestamp-bar"></div>
<div id="toast"></div>

<script>
const DEFAULT = { user:'unixpected', repo:'PRICE_CHECK', branch:'main', path:'products.csv', currency:'₱', storeName:'PriceCheck' };
function getSettings() {
  try { return { ...DEFAULT, ...JSON.parse(localStorage.getItem('pcSettings')||'{}') }; }
  catch { return { ...DEFAULT }; }
}

let products = [];
let html5Qr = null;
let cameras = [];
let camIdx = 0;
let scanning = false;
let flashOn = false;
let barcodeIndex = new Map();

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('brandText').innerHTML = escHtml(getSettings().storeName || 'Price') + '<span>Check</span>';
  loadCSV(false);
  updateBasketBadge();
});

function showTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'search') renderBrowse();
  if (name === 'basket') renderBasket();
}

async function loadCSV(showFeedback = false) {
  updateDbBadge(null);
  const s = getSettings();
  const remoteUrl = `https://raw.githubusercontent.com/${s.user}/${s.repo}/${s.branch}/${s.path}?nc=` + Date.now();
  
  try {
    const res = await fetch(remoteUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    products = parseCSV(text);
    updateDbBadge(true, products.length);
    if (showFeedback) toast('Loaded ' + products.length + ' products');
  } catch (e) {
    const cached = localStorage.getItem('pcCsvCache');
    if (cached) {
      products = parseCSV(cached);
      updateDbBadge(true, products.length);
      if (showFeedback) toast('Using offline cache');
    } else {
      updateDbBadge(false, 0);
    }
  }
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h => h.trim().replace(/^\uFEFF/, '').replace(/^"|"$/g, '').toLowerCase());

  const parsed = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = lines[i].split(delim);
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (cols[idx] || '').trim());
    if (obj.citem) parsed.push(obj);
  }
  buildBarcodeIndex(parsed);
  return parsed;
}

function buildBarcodeIndex(prods) {
  barcodeIndex.clear();
  for (const p of prods) {
    const cupc = String(p.cupc || '').trim();
    const sku = String(p.sku || '').trim().replace(/\.00$/, '');
    if (cupc && cupc !== '0') indexAdd(cupc, p);
    if (sku) indexAdd(sku, p);
    if (cupc.length <= 12) indexAdd(cupc.padStart(13, '0'), p);
  }
}

function indexAdd(key, product) {
  if (!barcodeIndex.has(key)) barcodeIndex.set(key, product);
}

async function startScan() {
  if (scanning) return;
  try {
    cameras = await Html5Qrcode.getCameras();
    if (!cameras.length) throw new Error('No camera found');
    html5Qr = new Html5Qrcode('reader');
    await html5Qr.start(
      cameras[0].id,
      { fps: 20, qrbox: { width: 240, height: 140 }, aspectRatio: 1.0 },
      (decoded) => handleBarcode(decoded),
      () => {}
    );
    scanning = true;
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = '';
    if (cameras.length > 1) document.getElementById('btnFlip').style.display = '';
  } catch (e) {
    toast('Camera Error: ' + e.message);
  }
}

async function stopScan() {
  if (html5Qr && scanning) {
    await html5Qr.stop();
    html5Qr.clear();
  }
  scanning = false;
  document.getElementById('btnStart').style.display = '';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('btnFlip').style.display = 'none';
}

function handleBarcode(code) {
  showResult(code, true);
}

function manualSearch() {
  const q = document.getElementById('manualBarcode').value.trim();
  if (q) showResult(q, false);
}

function showResult(query, fromScan) {
  const cur = getSettings().currency || '₱';
  const el = document.getElementById('resultArea');
  let hit = barcodeIndex.get(query);

  if (!hit) {
    const q = query.toLowerCase();
    hit = products.find(p => (p.citem || '').toLowerCase().includes(q));
  }

  if (!hit) {
    el.innerHTML = `
      <div class="result-card not-found">
        <div class="result-header">Product Not Found</div>
        <div class="result-title">"${escHtml(query)}"</div>
      </div>`;
    return;
  }

  const price = parseFloat(hit.mprice) || 0;
  el.innerHTML = `
    <div class="result-card found">
      <div class="result-header">Item Details</div>
      <div class="result-title">${escHtml(hit.citem)}</div>
      <div class="result-price-tag">${cur}${price.toFixed(2)}</div>
      <div class="meta-tags">
        <div class="tag">SKU: <strong>${escHtml(hit.sku || 'N/A')}</strong></div>
        <div class="tag">Unit: <strong>${escHtml(hit.cuom || 'PC')}</strong></div>
      </div>
      <button class="btn btn-accent btn-full" onclick="addToBasket('${escAttr(hit.cupc || hit.sku)}')">🧺 Add to Basket</button>
    </div>`;
}

function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr(s) { return String(s).replace(/'/g, "\\'"); }
function updateDbBadge(ok, count) {
  const el = document.getElementById('dbStatusBadge');
  el.className = 'status-badge ' + (ok ? 'ok' : 'err');
  el.innerHTML = `<div class="pulse-dot"></div><span>${ok ? count + ' Items' : 'Offline'}</span>`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
